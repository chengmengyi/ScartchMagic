plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id 'com.google.firebase.crashlytics'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.scratchmagic.getmore.reward.scratch_magic"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.scratchmagicwin.getmore.reward"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 26
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            keyAlias 'magic'
            keyPassword 'magic123'
            storeFile file('key/magic.jks')
            storePassword 'magic123'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

        }
    }
}

flutter {
    source '../..'
}

dependencies {

    implementation 'com.google.android.gms:play-services-base:16.1.0'

    implementation 'com.applovin.mediation:bigoads-adapter:4.9.1.1'
    implementation 'com.applovin.mediation:fyber-adapter:8.3.1.1'
    implementation 'com.applovin.mediation:google-ad-manager-adapter:23.5.0.0'
    implementation 'com.applovin.mediation:google-adapter:23.5.0.0'
    implementation 'com.applovin.mediation:inmobi-adapter:10.7.8.1'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.applovin.mediation:chartboost-adapter:9.7.0.4'
    implementation 'com.applovin.mediation:ironsource-adapter:8.4.0.0.1'
    implementation 'com.applovin.mediation:vungle-adapter:7.4.1.4'
    implementation 'com.applovin.mediation:facebook-adapter:6.18.0.1'
    implementation 'com.applovin.mediation:mintegral-adapter:16.8.61.1'
    implementation 'com.applovin.mediation:bytedance-adapter:6.2.0.7.0'
    implementation 'com.applovin.mediation:unityads-adapter:4.12.3.1'
    implementation 'com.applovin.mediation:moloco-adapter:3.2.0.0'
    implementation 'com.applovin.mediation:bidmachine-adapter:3.0.1.2'


    implementation platform('com.google.firebase:firebase-bom:32.1.1')
    implementation("com.google.firebase:firebase-analytics-ktx")
    implementation 'com.google.firebase:firebase-crashlytics-ktx'
}
